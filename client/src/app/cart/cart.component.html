<div class="cart-sidebar" [class.open]="isCartOpen$ | async">
  <div class="cart-header">
    <h2>Shopping Cart</h2>
    <span class="close-btn" (click)="closeCart()">&times;</span>
  </div>

  <div *ngIf="cart$ | async as cart">
    <div *ngIf="cart.items.length > 0; else emptyCart">
      <div class="cart-items">
        <div class="cart-item" *ngFor="let item of cart.items">
          <img [src]="item.product.imageUrl" alt="{{ item.product.name }}" class="cart-item-image" />
          <div class="cart-item-details">
            <p class="cart-item-name">{{ item.product.name }}</p>
            <p class="cart-item-price">₹{{ item.product.price }}</p>
            <div class="cart-item-quantity">
              <button (click)="updateQuantity(item.product._id, item.quantity - 1)" [disabled]="item.quantity <= 1">-</button>
              <input type="number" [(ngModel)]="item.quantity" (change)="updateQuantity(item.product._id, item.quantity)" min="1" />
              <button (click)="updateQuantity(item.product._id, item.quantity + 1)">+</button>
            </div>
          </div>
          <button class="remove-btn" (click)="removeFromCart(item.product._id)">Remove</button>
        </div>
      </div>

      <div class="cart-footer">
        <div class="total-amount">
          <strong>Total Amount:</strong> ₹{{ totalAmount }}
        </div>
        <button class="checkout-btn" (click)="checkout()">Proceed to Checkout</button>
        <button class="clear-btn" (click)="clearCart()">Clear Cart</button>
      </div>
    </div>

    <ng-template #emptyCart>
      <p>Your cart is empty.</p>
    </ng-template>
  </div>
</div>
