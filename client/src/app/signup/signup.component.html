<div class="auth-container">
    <h2>Sign Up</h2>
    <form (ngSubmit)="onSignup()">
      
      <label for="username">Username</label>
      <input type="text" id="username" [(ngModel)]="user.username" name="username" required>

      <label for="name">Full Name</label>
      <input type="text" id="name" [(ngModel)]="user.name" name="name" required>
  
      <label for="email">Email</label>
      <input type="email" id="email" [(ngModel)]="user.email" name="email" required>
  
      <label for="password">Password</label>
      <input type="password" id="password" [(ngModel)]="user.password" name="password" required>

      <div class="address-container">
          <div>
              <label for="street">Street</label>
              <input type="text" id="street" [(ngModel)]="user.address[0].street" name="street" required>
          </div>
          
          <div>
              <label for="city">City</label>
              <input type="text" id="city" [(ngModel)]="user.address[0].city" name="city" required>
          </div>

          <div>
              <label for="state">State</label>
              <input type="text" id="state" [(ngModel)]="user.address[0].state" name="state" required>
          </div>

          <div>
              <label for="postalCode">Postal Code</label>
              <input type="text" id="postalCode" [(ngModel)]="user.address[0].postalCode" name="postalCode" required>
          </div>
      </div>

      <label for="country">Country</label>
      <input type="text" id="country" [(ngModel)]="user.address[0].country" name="country" required>
  
      <button type="submit">Sign Up</button>
    </form>
    <p>Already have an account? <a routerLink="/login">Login</a></p>
</div>
